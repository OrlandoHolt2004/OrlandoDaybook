<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daybook</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDF0F2">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one household ledger with four tabs; each tab is an index-card catalogue — a list on one side, the open record on the other. */
:root {
  --paper: #EDF0F2; --card: #FBFCFC; --ink: #18212B; --muted: #5B6875; --rule: #D3DAE0;
  --stamp: #3346B8; --stamp-soft: #E3E7F8; --mark: #FFE9A8; --danger: #B3261E; --good: #2F7A4F; --good-soft: #DDEFE3;
  --f-display: "Gloock", Georgia, "Times New Roman", serif;
  --f-read: "Source Serif 4", Georgia, serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12161B; --card: #1A2028; --ink: #E4E9EE; --muted: #94A1AE; --rule: #2B333D;
  --stamp: #8C9BFF; --stamp-soft: #232B4A; --mark: #5A4A12; --danger: #F2867C; --good: #6BCB8E; --good-soft: #1D3527; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #12161B; --card: #1A2028; --ink: #E4E9EE; --muted: #94A1AE; --rule: #2B333D;
  --stamp: #8C9BFF; --stamp-soft: #232B4A; --mark: #5A4A12; --danger: #F2867C; --good: #6BCB8E; --good-soft: #1D3527; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
.gutter { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top .gutter { display: flex; align-items: center; gap: 18px; padding-block: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; line-height: 1; margin: 0; }
.tabs { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--rule); border-radius: 9px; padding: 3px; overflow-x: auto; max-width: 100%; }
.tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--stamp); color: var(--card); }
.today { margin-left: auto; font-family: var(--f-mono); font-size: .76rem; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
main.gutter { padding-block: 24px 64px; }

/* Shared atoms */
.btn { border: 1px solid var(--rule); background: var(--card); border-radius: 7px; padding: 8px 14px; cursor: pointer; font-weight: 500; font-size: .9rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--stamp); border-color: var(--stamp); color: var(--card); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--stamp-soft); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--card); }
.btn:disabled { opacity: .55; cursor: default; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.8rem; line-height: 1.1; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; line-height: 1.15; margin: 0; }
.by { font-family: var(--f-read); font-style: italic; color: var(--muted); font-size: 1.02rem; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: .78rem; color: var(--muted); font-weight: 500; }
.field input, .field textarea, .field select { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 8px 10px; width: 100%; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--stamp); outline: none; }
.field textarea { font-family: var(--f-read); font-size: 1rem; line-height: 1.55; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.box { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.empty { border: 1px dashed var(--rule); border-radius: 10px; padding: 24px 20px; display: flex; flex-direction: column; gap: 8px; color: var(--muted); }
.empty h3 { color: var(--ink); }
.empty p { margin: 0; max-width: 56ch; }
.title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.chip { font-family: var(--f-mono); font-size: .74rem; background: var(--stamp-soft); color: var(--stamp); border: 0; border-radius: 999px; padding: 2px 9px; cursor: pointer; }
.chip:hover { text-decoration: underline; }
.toggle { border: 1px solid var(--rule); background: var(--card); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .88rem; }
.toggle[aria-pressed="true"] { background: var(--stamp-soft); border-color: var(--stamp); color: var(--stamp); font-weight: 500; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--stamp); animation: pulse 1.1s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: .88rem; max-width: calc(100% - 32px); z-index: 20; }
.stamp { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; color: var(--stamp); border: 1.5px solid var(--stamp); border-radius: 3px; padding: 1px 6px; transform: rotate(-2deg); opacity: .85; white-space: nowrap; }

/* Two-column catalogue */
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
.side-head { display: flex; justify-content: space-between; align-items: center; }
.list { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.item { width: 100%; text-align: left; background: transparent; border: 0; border-left: 2px solid transparent; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 1px 10px; border-radius: 0 6px 6px 0; }
.item:hover { background: var(--card); }
.item[aria-current="true"] { background: var(--card); border-left-color: var(--stamp); }
.item .t { font-family: var(--f-read); font-weight: 600; font-size: .97rem; line-height: 1.25; overflow-wrap: anywhere; }
.item .a { grid-column: 1; font-size: .8rem; color: var(--muted); }
.item .n { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-family: var(--f-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.group-label { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 2px; }

/* Ask bar */
.ask { display: flex; gap: 8px; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 6px; }
.ask input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px; font-family: var(--f-read); font-size: 1.05rem; }
.ask input:focus { outline: none; }
.ask:focus-within { border-color: var(--stamp); }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }

/* Note cards */
.cards { display: flex; flex-direction: column; gap: 12px; list-style: none; margin: 0; padding: 0; }
.note { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.note-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.note-head .stamp { margin-left: auto; }
.ref { font-family: var(--f-mono); font-size: .82rem; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.src { font-family: var(--f-read); font-size: .9rem; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.src:hover { color: var(--stamp); text-decoration: underline; }
.src b { font-weight: 600; color: var(--ink); }
.note-text { font-family: var(--f-read); font-size: 1.04rem; line-height: 1.6; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.note-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.actions { margin-left: auto; display: flex; gap: 2px; }
.why { font-size: .86rem; color: var(--muted); border-top: 1px dashed var(--rule); padding-top: 8px; margin: 0; }
.answer p { font-family: var(--f-read); font-size: 1.05rem; line-height: 1.6; margin: 0; max-width: 68ch; }
.composer-meta { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 10px; align-items: end; }

/* Meals */
.meal { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 4px 16px; }
.meal-date { grid-row: 1 / span 4; display: flex; flex-direction: column; align-items: center; border-right: 1px solid var(--rule); padding-right: 14px; font-variant-numeric: tabular-nums; }
.meal-date .d { font-family: var(--f-display); font-size: 1.9rem; line-height: 1; }
.meal-date .m { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; color: var(--muted); }
.meal-guests { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.meal-guests .occ { font-family: var(--f-read); font-style: italic; color: var(--muted); margin-right: 4px; }
.menu { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; font-family: var(--f-read); }
.menu li::before { content: "— "; color: var(--muted); }
.went { font-family: var(--f-read); color: var(--ink); margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .97rem; }
.went::before { content: "How it went: "; font-family: var(--f-ui); font-size: .78rem; color: var(--muted); font-weight: 500; }
.stars { font-size: 1rem; letter-spacing: 2px; color: var(--stamp); }
.star-input { display: flex; gap: 4px; }
.star-input button { border: 0; background: none; font-size: 1.3rem; cursor: pointer; color: var(--rule); padding: 0 2px; line-height: 1; }
.star-input button.on { color: var(--stamp); }
.guest-btn .a { font-family: var(--f-mono); font-size: .74rem; }
.last-served { background: var(--stamp-soft); border-radius: 8px; padding: 12px 14px; }
.last-served p { margin: 0; font-family: var(--f-read); }

/* Fitness */
.plan-days { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.day { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.day h4 { margin: 0; font-family: var(--f-read); font-size: 1.05rem; font-weight: 600; }
.ex { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ex li { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 0 10px; padding: 6px 0; border-top: 1px solid var(--rule); }
.ex li:first-child { border-top: 0; }
.ex .nm { font-weight: 500; }
.ex .rx { font-family: var(--f-mono); font-size: .8rem; color: var(--stamp); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ex .tip { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); }
.templates { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tpl { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; }
.tpl:hover { border-color: var(--stamp); }
.tpl .t { font-family: var(--f-read); font-weight: 600; font-size: 1.02rem; }
.tpl p { margin: 0; font-size: .87rem; color: var(--muted); }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .04em; border-radius: 4px; padding: 1px 6px; background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.badge.fit { background: var(--good-soft); color: var(--good); border-color: transparent; }
.tip-list { margin: 0; padding-left: 18px; color: var(--muted); font-size: .9rem; display: flex; flex-direction: column; gap: 2px; }

/* Habits */
.habit { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; }
.habit .name { font-family: var(--f-read); font-weight: 600; font-size: 1.08rem; overflow-wrap: anywhere; }
.habit .sub { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, 40px); gap: 6px; }
.daybtn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; }
.daybtn .lbl { font-family: var(--f-mono); font-size: .64rem; color: var(--muted); letter-spacing: .04em; }
.daybtn .sq { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--rule); display: grid; place-items: center; font-size: .95rem; color: transparent; background: var(--paper); }
.daybtn.is-today .sq { border-color: var(--stamp); }
.daybtn.done .sq { background: var(--good); border-color: var(--good); color: var(--card); }
.daybtn:hover .sq { border-color: var(--good); }
.strip { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 2px; }
.strip span { height: 6px; border-radius: 2px; background: var(--rule); }
.strip span.on { background: var(--good); }
.habit-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.streak { font-family: var(--f-mono); font-size: .8rem; color: var(--good); font-weight: 500; }
.summary-bar { display: flex; gap: 24px; flex-wrap: wrap; align-items: baseline; }
.big { font-family: var(--f-display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .side { position: static; }
  .today { display: none; }
}
@media (max-width: 560px) {
  .grid2, .grid3, .composer-meta { grid-template-columns: minmax(0, 1fr); }
  .habit { grid-template-columns: minmax(0, 1fr); }
  .week { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .daybtn .sq { width: 100%; max-width: 38px; aspect-ratio: 1; height: auto; }
  .meal { grid-template-columns: 56px minmax(0, 1fr); gap: 4px 12px; }
  .meal-date { padding-right: 10px; }
  h2 { font-size: 1.5rem; }
}

/* Additions: Bible reader, hosting calendar */
:root { --meal: #9A5B13; --meal-soft: #F6EAD8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --meal: #E0A35C; --meal-soft: #3A2A16; } }
:root[data-theme="dark"] { --meal: #E0A35C; --meal-soft: #3A2A16; }
.seg { display: inline-flex; gap: 2px; background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 500; color: var(--muted); font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--stamp-soft); color: var(--stamp); }

.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
.chapters button { border: 1px solid var(--rule); background: var(--card); border-radius: 5px; padding: 5px 0; font-family: var(--f-mono); font-size: .76rem; cursor: pointer; position: relative; font-variant-numeric: tabular-nums; }
.chapters button:hover { border-color: var(--stamp); }
.chapters button[aria-current="true"] { background: var(--stamp); border-color: var(--stamp); color: var(--card); }
.chapters button.has::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--stamp); }
.chapters button[aria-current="true"].has::after { background: var(--card); }
.bible-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.verses { display: flex; flex-direction: column; gap: 1px; max-width: 760px; }
.verse { border-radius: 8px; }
.verse.open { background: var(--card); box-shadow: 0 0 0 1px var(--rule); }
.vbtn { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 0 8px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 10px 6px 4px; cursor: pointer; border-radius: 8px; align-items: baseline; }
.vbtn:hover { background: var(--card); }
.vn { font-family: var(--f-mono); font-size: .74rem; color: var(--stamp); text-align: right; font-variant-numeric: tabular-nums; }
.vt { font-family: var(--f-read); font-size: 1.1rem; line-height: 1.7; overflow-wrap: anywhere; }
.vt .sup { color: var(--muted); }
.vc { font-family: var(--f-mono); font-size: .7rem; background: var(--stamp-soft); color: var(--stamp); border-radius: 999px; padding: 1px 8px; white-space: nowrap; align-self: center; }
.vnotes { padding: 2px 14px 14px 46px; display: flex; flex-direction: column; gap: 10px; }
.vnotes .note { border-radius: 6px; background: var(--paper); }
.who { font-weight: 600; font-size: .88rem; }
.who.mine { color: var(--stamp); }
.vform { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--rule); padding-top: 10px; }
.vform .composer-meta { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
.verse-quote { font-family: var(--f-read); font-style: italic; color: var(--muted); margin: 0; font-size: .97rem; border-left: 2px solid var(--rule); padding-left: 10px; }
.chap-select { display: none; }

.cal { display: flex; flex-direction: column; gap: 10px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-dow { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cal-day { min-height: 78px; background: var(--paper); border: 1px solid transparent; border-radius: 6px; padding: 4px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; text-align: left; min-width: 0; overflow: hidden; }
.cal-day:hover { border-color: var(--rule); }
.cal-day.other { opacity: .45; }
.cal-day.today .num { background: var(--stamp); color: var(--card); border-radius: 4px; padding: 0 4px; }
.cal-day[aria-pressed="true"] { border-color: var(--stamp); background: var(--card); }
.cal-day .num { font-family: var(--f-mono); font-size: .74rem; align-self: flex-start; font-variant-numeric: tabular-nums; }
.pill { font-size: .7rem; line-height: 1.3; border-radius: 3px; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill.stay { background: var(--stamp-soft); color: var(--stamp); }
.pill.meal { background: var(--meal-soft); color: var(--meal); }

  async function runAsk(raw) {
    const q = String(raw || '').trim(); if (!q) return;
    $('rdAsk').value = q; ui.ctl?.abort(); ui.editing = null;
    if (q.startsWith('#')) { ui.ask = { q, tag: parseTags(q)[0] || '' }; return draw(); }
    const passage = parseRef(q);
    if (passage && passage.c) {
      // A plain reference like "John 3:16": go straight to the verse.
      const hasNotes = S.notes.some(n => n.kind === 'verse' && n.b === passage.b && n.c === passage.c && (!passage.v || n.v === passage.v)) || S.meetings.some(m => parseRanges(m.scriptures).some(r => r.b === passage.b && r.c1 <= passage.c && passage.c <= r.c2));

    if (passage && passage.c) { ui.ask = { q, passage, status: 'none' }; return draw(); }
    if (!S.notes.length) { ui.ask = { q, status: 'done', matches: [], summary: '' }; return draw(); }
    if (!sample) { ui.ask = { q, status: 'fallback' }; return draw(); }
    ui.ask = { q, status: 'thinking' }; draw();
    const ctl = ui.ctl = new AbortController();

      let src;
      if (n.kind === 'verse') { const vt = cachedVerse(n.b, n.c, n.v); src = `Bible ${refOf(n.b, n.c, n.v)}${vt ? ' ("' + vt.slice(0, 160) + '")' : ''} — note by ${isMine(n.author) ? 'the reader' : n.author}`; }
      else { const s = srcById(n.sourceId), mt = n.meetingId ? meetById(n.meetingId) : null;
        src = s ? (isMinistry(s) ? `Ministry: ${volName(s)}${s.author ? ' (' + s.author + ')' : ''}${mt ? ' — ' + meetTitle(mt) + ', ' + ministryDate(mt.date) + (mt.scriptures ? ', scriptures read: ' + mt.scriptures : '') : ''}` : `Book "${s.title}"${s.author ? ' by ' + s.author : ''}`) : 'Unknown';
        if (n.ref) src += ' — p. ' + n.ref; if (n.scripture) src += ' — refers to ' + n.scripture; }
      const line = `[${n.id}] ${src}${n.tags?.length ? ' — tags: ' + n.tags.join(', ') : ''}\n${n.text}\n\n`;
      if (corpus.length + line.length > 200000) break; corpus += line;
    }
    const prompt = `You are helping a Christian reader search their own notes: notes on Bible verses (J. N. Darby's translation), some their own and some copied from other writers and named, plus notes on ministry they have read (volumes such as the White Book series by BDH, each holding meetings like readings and preachings with the scriptures read) and books they read. Each note starts with its id in square brackets, then its source.\n\nThe reader asks: "${q}"\n\nFind every note genuinely relevant to this subject or question, including notes that treat it in different words or through a related passage. Order from most to least relevant. Leave out unrelated notes.\n\nReply with only JSON in this shape:\n{"summary": "2-3 sentences, addressed to the reader as 'you', on what the notes say about this, naming other writers where their notes are used. Empty string if nothing is relevant.", "matches": [{"id": "the note id", "why": "one short sentence on how this note relates"}]}\n\nNOTES:\n${corpus}`;
    try {
      const res = await sample.json(prompt, { signal: ctl.signal });
      if (ctl !== ui.ctl) return;
      const matches = Array.isArray(res?.matches) ? res.matches.filter(m => m && typeof m.id === 'string').map(m => ({ id: m.id, why: String(m.why || '') })) : [];
      ui.ask = { q, status: 'done', matches, summary: typeof res?.summary === 'string' ? res.summary : '' };
    } catch (e) {
      if (ctl !== ui.ctl) return;
      if (e?.code === 'cancelled') ui.ask = { q, status: 'fallback' };
      else if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e?.code)) { sample = null; ui.ask = { q, status: 'error', error: 'Smart search isn’t available here, so these are the notes that use your exact words.' }; }
      else if (e?.code === 'rate_limited') ui.ask = { q, status: 'error', error: 'You’ve searched a lot in a short time. Wait a minute and press Find again. Exact word matches are below.' };
      else ui.ask = { q, status: 'error', error: 'The search didn’t finish. Press Find to try again. Exact word matches are below.' };
    }
    if (S.tab === 'reading' && root?.isConnected && ui.ask?.q === q) draw();
  }

/* ================= ENTERTAINING ================= */
function Hosting() {
  const now = new Date();
  const ui = { month: new Date(now.getFullYear(), now.getMonth(), 1), day: todayIso(), form: 'meal', editing: null, person: '', filter: '', type: 'all', alloc: 'any', rating: 0, where: 'home', allocated: false };
  let root, calEl, dayEl, formSlot, listEl, guestEl, personEl;
  const stayEnd = s => iso(addDays(fromIso(s.arrive), Math.max(1, Number(s.nights) || 1)));
  const staysOn = d => S.stays.filter(s => s.arrive && s.arrive <= d && d < stayEnd(s));
  const mealsOn = d => S.meals.filter(m => m.date === d);
  const isOut = m => m.kind === 'out';
  const people = x => isOut(x) ? [x.host, ...(x.guests || [])].filter(Boolean) : (x.guests || []);
  const entries = () => [
    ...S.meals.map(m => ({ type: isOut(m) ? 'out' : 'meal', date: m.date || '', people: people(m), item: m })),
    ...S.stays.map(s => ({ type: 'stay', date: s.arrive || '', people: s.guests || [], item: s }))];
  const low = s => String(s || '').toLowerCase().trim();
  const nameMatch = (name, q) => { const a = low(name), b = low(q); return !!b && (a === b || a.includes(b) || (b.length > 3 && b.includes(a) && a.length > 2)); };
  const allNames = () => { const m = new Map(); for (const e of entries()) for (const p of e.people) if (!m.has(low(p))) m.set(low(p), p); return [...m.values()]; };
  function personFromQuery(q) {
    const t = low(q); if (!t) return '';
    const known = allNames().filter(n => t.includes(low(n))).sort((a, b) => b.length - a.length);
    if (known.length) return known[0];
    const m = t.match(/(?:with|had|have|for|of|at|to)\s+(?:the\s+)?([a-z][\w' .-]+?)(?:\s+(?:for|over|to|round|a meal|meals?|stay|come).*)?\??$/i);
    return (m ? m[1] : q).replace(/[?.!]+$/, '').trim();
  }

  function mount(v) {
    root = v;

          el('button', { class: 'btn', type: 'button', text: 'Restore from a file', onclick: () => fileIn.click() }), fileIn)),
      el('p', { class: 'hint', text: `${Store.count()} entries on this device.` })].filter(Boolean));
  }
  Sync.listeners.add(draw);
  return { mount, update: draw };
}

/* ================= Boot ================= */
const TABS = { reading: Reading(), hosting: Hosting(), fitness: Fitness(), backup: Backup() };
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));
{ const d = new Date(); $('today').textContent = `${DOW_L[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
document.body.append(
  el('datalist', { id: 'authors' }, el('option', { value: 'Me' })),
  el('datalist', { id: 'guestNames' }),
  el('datalist', { id: 'exNames' }),
  el('datalist', { id: 'seriesList' }), el('datalist', { id: 'ministerList' }), el('datalist', { id: 'placeList' }), el('datalist', { id: 'meetTypes' }),
  el('datalist', { id: 'occasions' }, ['Sunday lunch', 'Tea', 'Dinner', 'Lunch', 'Breakfast', 'Afternoon tea', 'Birthday', 'Christmas', 'Barbecue'].map(o => el('option', { value: o }))));

let start = 'reading';
const h = (location.hash || '').slice(1);
if (TABS[h]) start = h; else { try { const t = localStorage.getItem('daybook.tab'); if (TABS[t]) start = t; } catch (e) {} }
showTab(start, false);

(async () => {
  db = localDb;
  const cols = ['sources', 'notes', 'meals', 'stays', 'workouts', 'sessions', 'guides', 'meetings'];
  const need = [...cols, 'fitness'];
  const settle = () => { if (!S.ready && need.every(k => S.got[k])) { S.ready = true; refreshAuthors(); showTab(S.tab, false); } else dataChanged(); };
  const fail = () => { S.unavailable = true; showTab(S.tab, false); };
  for (const c of cols)
    db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.got[c] = true; settle(); }, fail);
  db.doc('settings/fitness').onSnapshot(snap => { const first = !S.got.fitness; S.fitness = snap.exists ? snap.data() : null; S.got.fitness = true; if (first) settle(); }, fail);
  db.doc('settings/plan').onSnapshot(() => dataChanged());
  Sync.soon(200);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
